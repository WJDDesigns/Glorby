<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Glorby</title>
<style>
  /* The studio reads Home Assistant's theme names, so the web app supplies the same ones. */
  :root {
    --primary-background-color: #f4f5f8;
    --card-background-color: #ffffff;
    --secondary-background-color: #e9ebf0;
    --primary-text-color: #14161c;
    --secondary-text-color: #565d6b;
    --divider-color: #d3d7df;
    --primary-color: #0071c7;
    --text-primary-color: #ffffff;
    --error-color: #e5352b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary-background-color: #101217;
      --card-background-color: #181b22;
      --secondary-background-color: #232730;
      --primary-text-color: #eceef3;
      --secondary-text-color: #a3aab7;
      --divider-color: #333945;
      --primary-color: #2aa5ff;
      --text-primary-color: #06121c;
      --error-color: #ff5a4f;
    }
  }
  html { background: var(--primary-background-color); scrollbar-gutter: stable; }
  body { margin: 0; color: var(--primary-text-color); background: var(--primary-background-color);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .connect { display: grid; gap: 12px; max-width: 460px; margin: 0 auto; padding: 40px 16px; }
  .connect h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
  .connect button { font: inherit; min-height: 44px; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    color: var(--primary-text-color); background: var(--secondary-background-color); border: 1px solid var(--divider-color); }
  .connect button:hover { border-color: var(--primary-color); }
  .connect button.primary { background: var(--primary-color); border-color: var(--primary-color); color: var(--text-primary-color); }
  .connect button:disabled { opacity: .6; cursor: progress; }
  .connect-choice { display: grid; gap: 2px; text-align: left; padding: 16px; background: var(--card-background-color) !important; }
  .connect-choice span { color: var(--secondary-text-color); font-size: 14px; }
  .connect-field { display: grid; gap: 6px; font-size: 14px; }
  .connect-field input { font: inherit; font-size: 16px; min-height: 44px; padding: 8px 12px; border-radius: 10px; min-width: 0;
    color: var(--primary-text-color); background: var(--card-background-color); border: 1px solid var(--divider-color); }
  .connect-error { --fill: var(--error-color); margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--fill);
    color: oklch(from var(--fill) clamp(.12, (l - .62) * -1000, .97) 0 0); }
  .connect-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .connect-actions button { white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
