<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Glorby</title>
<style>
  /* The studio reads Home Assistant's theme names, so the web app supplies the same ones. */
  :root {
    --primary-background-color: #f4f5f8;
    --card-background-color: #ffffff;
    --secondary-background-color: #e9ebf0;
    --primary-text-color: #14161c;
    --secondary-text-color: #565d6b;
    --divider-color: #d3d7df;
    --primary-color: #0071c7;
    --text-primary-color: #ffffff;
    --error-color: #e5352b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary-background-color: #101217;
      --card-background-color: #181b22;
      --secondary-background-color: #232730;
      --primary-text-color: #eceef3;
      --secondary-text-color: #a3aab7;
      --divider-color: #333945;
      --primary-color: #2aa5ff;
      --text-primary-color: #06121c;
      --error-color: #ff5a4f;
    }
  }
  html { background: var(--primary-background-color); scrollbar-gutter: stable; }
  body { margin: 0; color: var(--primary-text-color); background: var(--primary-background-color);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .connect { display: grid; gap: 12px; max-width: 460px; margin: 0 auto; padding: 40px 16px; }
  .connect h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
  .connect button { font: inherit; min-height: 44px; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    color: var(--primary-text-color); background: var(--secondary-background-color); border: 1px solid var(--divider-color); }
  .connect button:hover { border-color: var(--primary-color); }
  .connect button.primary { background: var(--primary-color); border-color: var(--primary-color); color: var(--text-primary-color); }
  .connect button:disabled { opacity: .6; cursor: progress; }
  .connect-choice { display: grid; gap: 2px; text-align: left; padding: 16px; background: var(--card-background-color) !important; }
  .connect-choice span { color: var(--secondary-text-color); font-size: 14px; }
  .connect-field { display: grid; gap: 6px; font-size: 14px; }
  .connect-field input { font: inherit; font-size: 16px; min-height: 44px; padding: 8px 12px; border-radius: 10px; min-width: 0;
    color: var(--primary-text-color); background: var(--card-background-color); border: 1px solid var(--divider-color); }
  .connect-error { --fill: var(--error-color); margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--fill);
    color: oklch(from var(--fill) clamp(.12, (l - .62) * -1000, .97) 0 0); }
  .connect-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .connect-actions button { white-space: nowrap; }
  .finder { display: grid; gap: 10px; }
  .finder-status, .finder-note { margin: 0; color: var(--secondary-text-color); font-size: 15px; }
  .finder.searching .finder-status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px;
    border-radius: 50%; background: var(--primary-color); vertical-align: middle; animation: finder-pulse 1.2s ease-in-out infinite; }
  @keyframes finder-pulse { 50% { opacity: .25; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .finder.searching .finder-status::before { animation: none; } }
  .finder-list { display: grid; gap: 8px; }
  .finder-list:empty { display: none; }
  .connect-choice.found { border: 2px solid var(--primary-color); }
  .connect-choice.found span { overflow-wrap: anywhere; }
  .finder-again { justify-self: start; }
  .app-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 16px;
    font-size: 13px; color: var(--secondary-text-color); }
  .connect button.link, dialog.settings button.link { min-height: 32px; padding: 4px 8px; background: none; border-color: transparent;
    color: var(--primary-color); }
  dialog.settings { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-sizing: border-box;
    padding: 0 20px 20px; border: 1px solid var(--divider-color); border-radius: 16px;
    color: var(--primary-text-color); background: var(--card-background-color); }
  dialog.settings::backdrop { background: rgb(0 0 0 / .45); }
  .settings-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 16px 0 12px; background: var(--card-background-color); border-bottom: 1px solid var(--divider-color); }
  .settings-head h2 { margin: 0; font-size: 20px; }
  .settings-section { display: grid; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--divider-color); }
  .settings-section:last-child { border-bottom: 0; padding-bottom: 0; }
  .settings-section h3 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--secondary-text-color); }
  .settings-rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 15px; }
  .settings-rows dt { color: var(--secondary-text-color); }
  .settings-rows dd { margin: 0; overflow-wrap: anywhere; }
  .settings-note { margin: 0; font-size: 14px; color: var(--secondary-text-color); }
  .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  dialog.settings button { font: inherit; font-size: 14px; min-height: 40px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
    color: var(--primary-text-color); background: var(--secondary-background-color); border: 1px solid var(--divider-color); }
  dialog.settings button:hover { border-color: var(--primary-color); }
  dialog.settings button.primary { background: var(--primary-color); border-color: var(--primary-color); color: var(--text-primary-color); }
  dialog.settings button:disabled { opacity: .6; cursor: progress; }
  .connect-or { margin: 16px 0 0; font-size: 14px; font-weight: 600; color: var(--secondary-text-color); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
