[platformio]
default_envs = glorb_s3

[env:glorb_s3]
;; Glorb lamp: ESP32-S3, 8 MB flash (QIO), same partition table as GLORB firmware, native USB serial
extends = env:esp32s3dev_8MB_none
custom_usermods = audioreactive net_watchdog glorby_lease
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"GLORB_S3_Glorby\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DATA_PINS=38 -D PIXEL_COUNTS=120 -D BTNPIN=0
  -D SR_DMTYPE=5 -D I2S_SDPIN=11 -D I2S_WSPIN=12 -D I2S_CKPIN=10
board_build.partitions = tools/WLED_ESP32_8MB.csv
